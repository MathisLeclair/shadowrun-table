# Shadowrun table on the VPS — its own compose project, plain HTTP on host port 8095 (see DEPLOY.md).
# Another stack owns ports 80/443 on this host: this file never touches them.
#   cd ~/shadowrun/app && docker compose up -d --build
name: shadowrun

services:
  shadowrun:
    build: .
    image: shadowrun-app:latest
    container_name: shadowrun
    restart: unless-stopped
    ports:
      - "8095:3000"
    environment:
      # Admin password for /admin (read from .env next to this file; applied again whenever it changes).
      SR_ADMIN_PASSWORD: ${SR_ADMIN_PASSWORD:?Set SR_ADMIN_PASSWORD in .env}
      # Max size of one uploaded zip (Foundry world, table restore), in bytes.
      SR_MAX_UPLOAD_BYTES: ${SR_MAX_UPLOAD_BYTES:-1500000000}
      # GM assistant (Claude API through Workload Identity Federation; ids written by deploy.ps1 -Action ai-setup).
      # The signing key lives in runtime/assistant/ (never in the image). No API key on the server.
      ANTHROPIC_ORGANIZATION_ID: ${ANTHROPIC_ORGANIZATION_ID:-}
      ANTHROPIC_FEDERATION_RULE_ID: ${ANTHROPIC_FEDERATION_RULE_ID:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${ANTHROPIC_SERVICE_ACCOUNT_ID:-}
      SR_ASSISTANT_HOST: ovh-vps   # stable JWT subject (the container hostname changes on every recreate)
      # Public demo table (DEPLOY.md « 4b »): its id, e.g. demo (empty = none) and the nightly reset hour (UTC here).
      SR_DEMO_TABLE: ${SR_DEMO_TABLE:-}
      SR_DEMO_NAME: ${SR_DEMO_NAME:-}
      SR_DEMO_LANG: ${SR_DEMO_LANG:-}
      SR_DEMO_RESET_HOUR: ${SR_DEMO_RESET_HOUR:-4}
      # 1 once the app is behind a reverse proxy (Caddy): real client IPs for the login limits.
      SR_TRUST_PROXY: ${SR_TRUST_PROXY:-}
    volumes:
      # Registry (server.json) + every table (state, backups, uploads, docs, uploaded Foundry worlds).
      - ./runtime:/app/runtime
      # Foundry assets of the historical « Project Lazarus » table (~490 MB, copied with deploy.ps1 -Action assets).
      - ./data/assets/foundry:/app/data/assets/foundry
      # Shared music library, every table (~330 MB, copied with deploy.ps1 -Action music; credits in CREDITS.md there).
      - ./data/assets/music:/app/data/assets/music
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
