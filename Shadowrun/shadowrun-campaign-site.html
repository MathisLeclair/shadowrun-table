<style>
  :root{
    --bg:#0b0e12; --panel:#12171d; --panel2:#171d24; --line:#232b34;

  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text);
    background-image: radial-gradient(circle at 20% 10%, #10202080 0%, transparent 40%), radial-gradient(circle at 80% 90%, #2a103080 0%, transparent 40%);
  }
  header{
    padding:18px 28px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(11,14,18,0.95); z-index:20; backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  header h1{
    margin:0; font-size:20px; letter-spacing:1px; color:var(--cyan); text-transform:uppercase;
  }
  header h1 span{color:var(--magenta);}
  header .sub{color:var(--dim); font-size:12px; margin-top:2px;}
  #search{
    background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:8px 14px; border-radius:6px;
    width:260px; font-size:13px;
  }
  #search:focus{outline:none; border-color:var(--cyan);}
  nav{
    display:flex; gap:4px; padding:0 28px; border-bottom:1px solid var(--line); background:var(--panel);
    overflow-x:auto; position:sticky; top:64px; z-index:19;
  }
  nav button{
    background:none; border:none; color:var(--dim); padding:12px 16px; font-size:13px; cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap; font-weight:600; letter-spacing:0.5px;
  }
  nav button:hover{color:var(--text);}
  nav button.active{color:var(--cyan); border-bottom-color:var(--cyan);}
  main{padding:24px 28px 80px; max-width:1100px; margin:0 auto;}
  section{display:none;}
  section.active{display:block; animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  h2.section-title{color:var(--amber); font-size:15px; text-transform:uppercase; letter-spacing:1.5px; margin:28px 0 12px; border-left:3px solid var(--amber); padding-left:10px;}
  h2.section-title:first-child{margin-top:0;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:14px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; cursor:pointer;
    transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:var(--cyan); transform:translateY(-1px);}
  .card h3{margin:0 0 4px; color:var(--cyan); font-size:15px;}
  .card .role{color:var(--magenta); font-size:12px; font-weight:600; margin-bottom:8px;}
  .card .teaser{color:var(--dim); font-size:13px; line-height:1.5;}
  .card .full{display:none; margin-top:12px; font-size:13px; line-height:1.6; color:var(--text); border-top:1px solid var(--line); padding-top:10px;}
  .card.open .full{display:block;}
  .card.open .teaser{display:none;}
  .stat-line{color:var(--dim); font-family:Consolas,monospace; font-size:12.5px; margin:4px 0;}
  .tag{display:inline-block; background:var(--panel2); border:1px solid var(--line); color:var(--amber); font-size:11px; padding:2px 8px; border-radius:20px; margin:2px 4px 2px 0;}
  .status{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:0.5px; text-transform:uppercase;}
  .status.done{background:#1d3a2c; color:#4fd17a;}
  .status.active{background:#3a2f1d; color:var(--amber);}
  .status.upcoming{background:#1d2a3a; color:var(--cyan);}
  .status.dead{background:#3a1d1d; color:#e05c5c;}
  .prose{color:var(--text); font-size:14px; line-height:1.7; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:14px;}
  .prose h3{color:var(--cyan); font-size:14px; margin:14px 0 6px;}
  .prose h3:first-child{margin-top:0;}
  .prose .why{color:var(--dim); font-size:13px;}
  .quest-phase{border-left:2px solid var(--line); padding-left:14px; margin:10px 0 10px 4px;}
  .quest-phase b{color:var(--amber);}
  .timeline{border-left:2px solid var(--line); margin-left:8px; padding-left:22px;}
  .timeline-item{position:relative; padding-bottom:22px;}
  .timeline-item::before{content:''; position:absolute; left:-27px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--cyan); border:2px solid var(--bg);}
  .timeline-item.dead::before{background:#e05c5c;}
  .timeline-item .date{color:var(--dim); font-size:12px; font-family:Consolas,monospace;}
  .timeline-item h4{margin:2px 0 4px; color:var(--text); font-size:14px;}
  .empty{color:var(--dim); font-style:italic; padding:20px; text-align:center;}
  footer{text-align:center; color:var(--dim); font-size:11px; padding:20px; border-top:1px solid var(--line);}
</style>
</head>

const TABS = [
  {id:"recap", label:"Recap"},
  {id:"pcs", label:"PJ"},
  {id:"npcs", label:"PNJ"},
  {id:"quests", label:"Quêtes / Actes"},
  {id:"factions", label:"Factions"},
  {id:"session2", label:"Session 2 (jouée)"},
  {id:"session3", label:"Session 3"},
];

function statusBadge(s){
  const map = {done:"Résolu", active:"En cours", upcoming:"À venir", dead:"Hors jeu"};
  return `<span class="status ${s}">${map[s]||s}</span>`;
}

function renderCardGrid(items){
  return `<div class="grid">` + items.map((it,i)=>`
    <div class="card" data-idx="${i}" onclick="this.classList.toggle('open')">
      <h3>${it.name} ${statusBadge(it.status)}</h3>
      <div class="role">${it.role}</div>
      <div class="teaser">${it.teaser}</div>
      <div class="full">${it.full}</div>
    </div>
  `).join('') + `</div>`;
}

function renderRecap(){
  let html = `<h2 class="section-title">Où en est l'histoire</h2>
  <div class="prose">${DATA.recap.where}</div>
  <h2 class="section-title">Prochaine session</h2>
  <div class="prose">${DATA.recap.next}</div>
  <h2 class="section-title">État des fils narratifs</h2>
  <div class="grid">`;
  DATA.recap.status.forEach(s=>{
    html += `<div class="card"><h3>${s.label} ${statusBadge(s.state)}</h3><div class="teaser">${s.note}</div></div>`;
  });
  html += `</div>`;
  return html;
}

function renderSession(key){
  const s2 = DATA[key];
  let html = `<h2 class="section-title">Ouverture</h2><div class="prose">${s2.intro}</div>
  <h2 class="section-title">Déroulé</h2><div class="timeline">`;
  s2.scenes.forEach(s=>{
    html += `<div class="timeline-item"><h4>${s.t}</h4><div>${s.d}</div></div>`;
  });
  html += `</div>
  <h2 class="section-title">PNJ nécessaires</h2><div class="prose">${s2.npcCards.map(x=>`<span class="tag">${x}</span>`).join(' ')}</div>
  <h2 class="section-title">Cartes / lieux</h2><div class="prose">${s2.maps.map(x=>`<span class="tag">${x}</span>`).join(' ')}</div>
  <h2 class="section-title">Continuité</h2><div class="prose">${s2.continuity}</div>`;
  return html;
}

function renderTab(id){
  if(id==="recap") return renderRecap();
  if(id==="session2") return renderSession("session2");
  if(id==="session3") return renderSession("session3");
  if(id==="pcs") return renderCardGrid(DATA.pcs);
  if(id==="npcs") return renderCardGrid(DATA.npcs);
  if(id==="quests") return renderCardGrid(DATA.quests);
  if(id==="factions") return renderCardGrid(DATA.factions);
  return "";
}

let currentTab = "recap";

function mountNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===currentTab?'active':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ currentTab=b.dataset.tab; render(); });
  });
}

function render(){
  mountNav();
  const main = document.getElementById('main');
  main.innerHTML = `<section class="active">${renderTab(currentTab)}</section>`;
  applySearch();
}

function applySearch(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  if(!q){
    document.querySelectorAll('.card').forEach(c=>c.style.display='');
    return;
  }
  document.querySelectorAll('.card').forEach(c=>{
    const txt = c.textContent.toLowerCase();
    c.style.display = txt.includes(q) ? '' : 'none';
  });
}

document.getElementById('search').addEventListener('input', applySearch);

render();
</script>
</body>
</html>
